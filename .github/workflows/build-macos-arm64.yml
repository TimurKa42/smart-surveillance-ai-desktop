name: Build macOS arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check architecture
        run: python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: pyinstaller main.spec --noconfirm

      - name: Verify arm64
        run: file dist/*.app/Contents/MacOS/*

      - name: Make DMG
        run: |
          APP=$(ls -d dist/*.app | head -1)
          hdiutil create -volname "SmartSurveillanceAI" -srcfolder "$APP" -ov -format UDZO SmartSurveillanceAI-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: SmartSurveillanceAI-macOS-arm64
          path: scripts/SmartSurveillanceAI-arm64.dmg
