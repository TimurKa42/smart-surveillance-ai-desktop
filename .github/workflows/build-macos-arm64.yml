name: Build macOS arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Embed API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'EMBEDDED_API_KEY = "%s"\n' "$GEMINI_API_KEY" > embedded_key.py

      - name: Build app
        run: pyinstaller --noconfirm --clean main.spec

      - name: Verify arm64
        run: file dist/LookBack.app/Contents/MacOS/LookBack | grep arm64

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - dist/LookBack.app
          codesign --verify --deep --strict --verbose=2 dist/LookBack.app

      - name: Make DMG
        run: bash build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: LookBack-macOS-arm64
          path: scripts/dist/LookBack-arm64.dmg
          if-no-files-found: error
          retention-days: 14
