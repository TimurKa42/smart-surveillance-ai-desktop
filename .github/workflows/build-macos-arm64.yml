name: Build macOS arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check architecture
        run: python -c "import platform; print(platform.machine())"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Embed API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'EMBEDDED_API_KEY = "%s"\n' "$GEMINI_API_KEY" > embedded_key.py

      - name: Build app
        run: pyinstaller --noconfirm --clean main.spec

      - name: Verify arm64
        run: file dist/*.app/Contents/MacOS/*

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - "dist/Smart Surveillance AI.app"
          codesign --verify --deep --strict --verbose=2 "dist/Smart Surveillance AI.app"

      - name: Make DMG
        run: |
          bash build_dmg.sh || {
            echo "Styled DMG failed, retrying without Finder styling"
            sed -i '' 's|--hide-extension "${APP_NAME}.app"|--hide-extension "${APP_NAME}.app" --skip-jenkins|' build_dmg.sh
            bash build_dmg.sh
          }

      - uses: actions/upload-artifact@v4
        with:
          name: SmartSurveillanceAI-macOS-arm64
          path: scripts/dist/SmartSurveillanceAI-arm64.dmg
